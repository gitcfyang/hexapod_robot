name: Publish web configurator (Web Serial 直连)

# 把单文件页面发布到 GitHub Pages: 板子插在用户自己电脑上时, 打开这个网址
# 点「连接」就能调参数, 不装任何东西 (浏览器 Web Serial 直接读写 USB CDC)。
#
# Pages 站点由工作流自己启用 (configure-pages 的 enablement: true): 站点没建过时
# 头一次跑会顺手建好并把 Source 指到 GitHub Actions —— 否则 deploy-pages 会以
# 「Get Pages site failed」失败 (仓库没开 Pages 时就是这个错)。
# 若仓库策略禁止 Actions 建站点, 才需要手动去 Settings → Pages → Source 选
# "GitHub Actions" (选 Deploy from a branch 的话本工作流跑完也不会发布)。
#
# ⚠️ Pages 有约 10 分钟缓存: 推送后刷不出新版先等等, 不是没发出去。

on:
  push:
    branches: [main]
    paths:
      - 'tools/webconfig/index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只发一份 (连推两次时, 让最后一次赢)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 收集站点文件
        # 页面是单文件 (内联 CSS/JS), 没有构建步骤: 复制成站点根就行。
        # 其余文件一律不发 —— 站点上只有这一个页面。
        run: |
          mkdir -p _site
          cp tools/webconfig/index.html _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 站点还没建过时由这里建 (需要下面的 pages: write); 已建过则是空操作
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
