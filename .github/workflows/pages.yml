name: Publish web configurator (Web Serial 直连)

# 把单文件页面发布到 GitHub Pages: 板子插在用户自己电脑上时, 打开这个网址
# 点「连接」就能调参数, 不装任何东西 (浏览器 Web Serial 直接读写 USB CDC)。
#
# ⚠️ 首次部署要在仓库里手动开一次 Pages: Settings → Pages → Build and deployment
# → Source 选 "GitHub Actions" (选 Deploy from a branch 的话本工作流跑完也不发布)。
# 实测 (2026-09-28): configure-pages 的 `enablement: true` **建不了**站点 —— 建站
# 要的权限比 GITHUB_TOKEN 能拿到的多, 报 "Resource not accessible by integration"
# (建站 = POST /repos/{owner}/{repo}/pages, 见 docs.github.com/rest/pages/pages)。
# 站点建好之后这一段不再起作用 (它先 GET, 只有 404 才去建), 所以留着无害。
# 站点不存在时的症状有两个: configure-pages 报「Get Pages site failed」, 或
# 上面那条 Resource not accessible。
#
# ⚠️ Pages 有约 10 分钟缓存: 推送后刷不出新版先等等, 不是没发出去。

on:
  push:
    branches: [main]
    paths:
      - 'tools/webconfig/index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只发一份 (连推两次时, 让最后一次赢)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 收集站点文件
        # 页面是单文件 (内联 CSS/JS), 没有构建步骤: 复制成站点根就行。
        # 其余文件一律不发 —— 站点上只有这一个页面。
        run: |
          mkdir -p _site
          cp tools/webconfig/index.html _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 站点还没建过时由这里建 (需要下面的 pages: write); 已建过则是空操作
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
