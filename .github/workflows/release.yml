name: Build and Release

# 打 tag 用 annotated 形式 (git tag -a v0.4.0 -m "..."): 轻量标签会被 git describe
# 忽略 (2026-09-28 实测), 本地构建的版本串就退回「上一个 tag + 距离 + 短哈希」。
# 发布出去的固件版本串另说: 它由下面 Configure 步骤显式传 github.ref_name, 不依赖
# checkout 的 tag 状态 —— 实测 v0.4.0 那次连 fetch-depth: 0 都没让 describe 看见
# 刚推的 tag, 编出来报的是 v0.3.0-56-g9be97c7 (见 pico/cmake/gen_version.cmake)。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 全历史 (不是默认的 depth 1)。版本串已经改由下面 Configure 显式传,
          # 不靠这个; 留着是为了本地化排查时 checkout 里有完整历史。
          # 别指望它能让 git describe 认出刚推的 tag —— 实测 v0.4.0 那次它没有。
          fetch-depth: 0

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

      - name: Configure CMake
        working-directory: pico
        run: |
          mkdir -p build
          cd build
          # 版本串 = 正在发的这个 tag (github.ref_name = v0.4.0), 明着传进去:
          # 跟着这个 release 走的固件, 启动横幅上就该是这个名字
          cmake .. -DCMAKE_BUILD_TYPE=Release -DPICO_SDK_FETCH_FROM_GIT=ON \
                   -DHEXAPOD_FW_GIT_OVERRIDE=${{ github.ref_name }}

      - name: Build firmware
        working-directory: pico/build
        run: make -j$(nproc)

      - name: Upload firmware and hardware files to Release
        uses: softprops/action-gh-release@v2
        with:
          # 面向使用者的要点写在 .github/release-body.md (每次发版改那一个文件);
          # generate_release_notes 生成的提交清单由 GitHub 接在要点之后
          body_path: .github/release-body.md
          generate_release_notes: true
          files: |
            pico/build/hexapod_pico.uf2
            tools/webconfig/index.html
            hardware/pcb/board/gerber/*.zip
            hardware/pcb/schematic.pdf
            hardware/pcb/board/assembly/*.csv
            hardware/bom/hexapod_bom.csv
            hardware/bom/hexapod_bom.md
            hardware/mechanical/*.step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
