name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Raspberry Pi Pico SDK
        uses: raspberrypi/pico-sdk@v2

      - name: Configure CMake
        working-directory: pico
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build firmware
        working-directory: pico/build
        run: make -j$(nproc)

      - name: Upload UF2 to Release
        uses: softprops/action-gh-release@v2
        with:
          files: pico/build/hexapod_pico.uf2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
